plugins { id 'com.android.application' }

android {
    namespace 'com.imo.operator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imo.operator'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.4.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Use the standard Android debug key only as a temporary installer key.
            // This makes the APK a normal release package (not testOnly) while avoiding
            // embedding a private production keystore in the public repository.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.7.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
