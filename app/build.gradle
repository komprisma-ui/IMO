plugins { id 'com.android.application' }

android {
    namespace 'com.imo.operator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.imo.operator'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.4.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            def ks = System.getenv('IMO_KEYSTORE')
            def kp = System.getenv('IMO_KEYSTORE_PASSWORD')
            def ka = System.getenv('IMO_KEY_ALIAS')
            def ap = System.getenv('IMO_KEY_PASSWORD')
            if (ks && kp && ka && ap) {
                storeFile file(ks)
                storePassword kp
                keyAlias ka
                keyPassword ap
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.7.aar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
