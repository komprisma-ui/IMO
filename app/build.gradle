plugins { id 'com.android.application' }

android { namespace 'com.imo.operator'; compileSdk 35
    defaultConfig { applicationId 'com.imo.operator'; minSdk 23; targetSdk 35; versionCode 309; versionName '2.2.0' }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}