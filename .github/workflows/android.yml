name: LUNA Android Control Build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager --licenses | Out-Null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        shell: pwsh
        run: |
          gradle --no-daemon assembleRelease --stacktrace

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path "app/build/outputs/apk/release" -Filter "*.apk" -File | Select-Object -First 1
          if ($null -eq $apk) { throw "Release APK not found" }
          if ($apk.Length -le 0) { throw "Release APK is empty" }
          & "$env:ANDROID_HOME/build-tools/35.0.0/apksigner.bat" verify --verbose $apk.FullName
          if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed" }
          Write-Host "APK: $($apk.FullName)"
          Write-Host "SIZE: $($apk.Length) bytes"
          (Get-FileHash -Algorithm SHA256 $apk.FullName).Hash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: imo-2.2.0-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "imo-2.2.0-${{ github.run_number }}"
          gh release create $tag "app/build/outputs/apk/release/app-release.apk" `
            --repo "${{ github.repository }}" `
            --title "IMO Full Device Agent 2.2.0" `
            --notes "Validated IMO Android full-device agent build."