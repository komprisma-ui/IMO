name: LUNA Android Control Build
on:
  push:
    branches: [ main, "feature/**" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="imo-2.2.0-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "IMO Full Device Agent 2.2.0" \
            --notes "IMO Android full-device agent with voice interaction, Gemini 2.5 Flash, Accessibility control, screenshot/UI observation, global actions, action execution, verification and recovery. Enable Accessibility after installation and configure the Gemini API key locally."
