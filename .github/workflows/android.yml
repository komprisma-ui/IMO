name: IMO Android Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch pinned speaker runtime and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets
          curl -fL --retry 4 --retry-all-errors -o app/libs/sherpa-onnx-1.13.7.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          echo "c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8  app/libs/sherpa-onnx-1.13.7.aar" | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o app/src/main/assets/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx
          echo "f682b514c05d947ee3fa91cd6ec6c5c7543479a128373fa29b1faedccd21fd11  app/src/main/assets/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx" | sha256sum -c -

      - name: Fetch pinned multilingual Whisper ASR model
        shell: bash
        run: |
          set -euo pipefail
          tmp="/tmp/whisper-tiny.tar.bz2"
          curl -fL --retry 4 --retry-all-errors -o "$tmp" https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2
          mkdir -p /tmp/whisper-tiny
          tar -xjf "$tmp" -C /tmp/whisper-tiny
          model_dir="$(find /tmp/whisper-tiny -maxdepth 1 -type d -name 'sherpa-onnx-whisper-tiny*' | head -n 1)"
          test -n "$model_dir"
          mkdir -p app/src/main/assets/asr/whisper-tiny
          cp "$model_dir/tiny-encoder.int8.onnx" app/src/main/assets/asr/whisper-tiny/
          cp "$model_dir/tiny-decoder.int8.onnx" app/src/main/assets/asr/whisper-tiny/
          cp "$model_dir/tiny-tokens.txt" app/src/main/assets/asr/whisper-tiny/
          sha256sum app/src/main/assets/asr/whisper-tiny/*

      - name: Build install-ready release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          sha256sum "$APK"

      - name: Upload installer APK
        uses: actions/upload-artifact@v4
        with:
          name: IMO-1.4.1-INSTALLER
          path: app/build/outputs/apk/release/*.apk
