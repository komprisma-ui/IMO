name: IMO Android Build
# Live hologram + installer validation

on:
  push:
    branches: [ main, "feature/**", "fix/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imo-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Validate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon tasks --all >/tmp/gradle-tasks.txt
          grep -q "assembleRelease" /tmp/gradle-tasks.txt

      - name: Fetch pinned speaker runtime and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs app/src/main/assets
          curl -fL --retry 4 --retry-all-errors -o app/libs/sherpa-onnx-1.13.7.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          echo "c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8  app/libs/sherpa-onnx-1.13.7.aar" | sha256sum -c -
          curl -fL --retry 4 --retry-all-errors -o app/src/main/assets/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx
          echo "f682b514c05d947ee3fa91cd6ec6c5c7543479a128373fa29b1faedccd21fd11  app/src/main/assets/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx" | sha256sum -c -

      - name: Fetch higher-accuracy multilingual Whisper ASR model
        shell: bash
        run: |
          set -euo pipefail
          tmp="/tmp/whisper-base.tar.bz2"
          curl -fL --retry 4 --retry-all-errors -o "$tmp" https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2
          mkdir -p /tmp/whisper-base
          tar -xjf "$tmp" -C /tmp/whisper-base
          model_dir="$(find /tmp/whisper-base -maxdepth 1 -type d -name 'sherpa-onnx-whisper-base*' | head -n 1)"
          test -n "$model_dir"
          mkdir -p app/src/main/assets/asr/whisper-base
          cp "$model_dir/base-encoder.int8.onnx" app/src/main/assets/asr/whisper-base/
          cp "$model_dir/base-decoder.int8.onnx" app/src/main/assets/asr/whisper-base/
          cp "$model_dir/base-tokens.txt" app/src/main/assets/asr/whisper-base/
          sha256sum app/src/main/assets/asr/whisper-base/*

      - name: Build install-ready release APK
        run: gradle --no-daemon assembleRelease --stacktrace --warning-mode all

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload installer APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: IMO-2.3.0-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish final APK as GitHub Release asset
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          TAG="imo-2.3.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "IMO 2.3.0 Final #${GITHUB_RUN_NUMBER}" \
            --notes "Verified IMO Android full-device agent build. Commit ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
